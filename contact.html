<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Sample Site</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-page">
    <h1>Contact us</h1>
    <p>For general inquiries, please contact our team.</p>
    <p>Email: <a href="mailto:hello@example.com">hello@example.com</a></p>
    <section class="office-hours">
      <h2 class="office-hours__heading">Office Hours</h2>
      <ul class="office-hours__list">
        <li class="office-hours__item">
          Monday to Friday: <time class="office-hours__time" datetime="09:00-17:00">9:00 AM to 5:00 PM</time>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
