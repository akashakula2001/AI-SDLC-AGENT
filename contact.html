<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with our team for general inquiries and support.">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-card" aria-labelledby="contact-heading">
    <header class="contact-header">
      <h1 id="contact-heading" class="contact-title">Contact Us</h1>
      <p class="contact-description">For general inquiries, please contact our team.</p>
    </header>

    <section class="contact-details" aria-label="Contact Information">
      <div class="contact-item">
        <span class="contact-label">Phone</span>
        <a href="tel:+18005550199" class="contact-value">+1 (800) 555-0199</a>
      </div>
      <div class="contact-item">
        <span class="contact-label">Address</span>
        <address class="contact-value">100 Innovation Way, Suite 400, Tech City, CA 94016</address>
      </div>
    </section>
  </main>
</body>
</html>
