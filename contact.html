<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Sample Site</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-page">
    <h1>Contact us</h1>
    <p>For general inquiries, please contact our team.</p>
    <p>Email: <a href="mailto:hello@example.com">hello@example.com</a></p>

    <section class="office-hours-container">
      <h2 class="office-hours-title">Office Hours</h2>
      <dl class="office-hours-schedule">
        <dt class="office-hours-days">Monday – Friday</dt>
        <dd class="office-hours-time">9:00 AM – 5:00 PM (EST)</dd>
        <dt class="office-hours-days">Saturday – Sunday</dt>
        <dd class="office-hours-time">Closed</dd>
      </dl>
    </section>
  </main>
</body>
</html>
